# Auto-merge caller for this PUBLIC plugin repo.
#
# Points at the PUBLIC reusable-workflows host (a public repo cannot call a
# private reusable workflow or composite action), and forwards the SCOPED
# 1Password token OP_AUTOMERGE_PUBLIC_TOKEN — read-only on the ip-automerge PEM
# alone (its own ip-automation-public vault), never the whole-vault
# OP_SERVICE_ACCOUNT_TOKEN. See devops-excellence ADR-045 and #192 (the
# security-surface decision + migration), and the reusable's header for the
# threat model. Requires the ip-automerge App installed on this repo (org-wide,
# repository_selection: all) and the org variables IP_AUTOMERGE_APP_{ID,CLIENT_ID}
# (visibility: all). If the token/App is absent the reusable fails closed and
# never blocks a PR.

name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge
    uses: Integral-Productivity/reusable-workflows/.github/workflows/reusable-auto-merge.yml@main
    secrets:
      OP_AUTOMERGE_PUBLIC_TOKEN: ${{ secrets.OP_AUTOMERGE_PUBLIC_TOKEN }}

# Standard Tier 3 CI — minimal dependency-review floor.
#
# Tier 3 repos (claude plugins, omnifocus plugins, content repos) do not
# standardize a build/test step here; work-type-specific CI (lint markdown,
# validate plugin manifests, tsc) lives in additional workflows owned by the
# template's scaffold layer. The standard guarantees the dependency-review
# floor only — every PR that touches deps gets vetted against the CVE feed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Integral-Productivity/reusable-workflows/.github/workflows/reusable-dependency-review.yml@v1

  internal-refs:
    # This plugin is public: fail on any tracked file that names a non-public org
    # repo (#97). Reads tools/internal-refs.config.json; no network.
    name: Internal repo references
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for internal repo references
        run: node tools/check-internal-refs.mjs

  hook-tests:
    # PostToolUse hook that tells an agent to babysit the PR it just opened
    # (ADR-0004). node:test, no dependencies, no network.
    name: Hook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run hook tests
        run: node --test hooks/babysit-pr.test.mjs

  bash-hook-tests:
    # The standing-lfg SessionStart hook and the skill-call log hook are bash, run as
    # `bash ...` from hooks.json. On a Mac that resolves to /bin/bash 3.2 unless Homebrew bash
    # comes first on PATH, so each suite runs under both. A suite's first argument is the
    # interpreter the hook runs under. No network beyond the Homebrew install.
    name: Bash hook tests
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One retry: a transient Homebrew failure should not fail the job.
      - name: Install bash 5
        run: |
          brew install bash || { sleep 15; brew install bash; }
          echo "BASH5=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"

      - name: Check the interpreters
        run: |
          /bin/bash -c 'echo "/bin/bash $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" -eq 3 ]'
          "$BASH5" -c 'echo "bash 5: $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" -ge 5 ]'
          command -v python3

      - name: Run hook suites under /bin/bash (3.2)
        run: |
          /bin/bash hooks/standing-lfg.test.sh /bin/bash
          /bin/bash hooks/skill-call-log.test.sh /bin/bash

      - name: Run hook suites under Homebrew bash 5
        run: |
          "$BASH5" hooks/standing-lfg.test.sh "$BASH5"
          "$BASH5" hooks/skill-call-log.test.sh "$BASH5"

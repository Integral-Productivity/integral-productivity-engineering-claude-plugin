# Standard @claude on-demand bot caller. See tier1/.github/workflows/claude.yml
# for the rationale on the `if:` gate — it is required, do not remove it.

name: Claude Code

# REQUIRED: a workflow_call reusable can only USE permissions the caller
# GRANTS. reusable-claude.yml needs write on contents/issues/pull-requests
# (+ id-token, actions:read). Without this block the org/repo default
# (contents: read) is all that's granted, and GitHub's workflow_call
# validator rejects the call at startup — a 0-second startup_failure with no
# jobs, before the @claude `if:` gate is even evaluated. Mirror the reusable's
# own permissions block. See devops-excellence#160.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: Integral-Productivity/reusable-workflows/.github/workflows/reusable-claude.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
